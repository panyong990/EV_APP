<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="required-role" content="user" />
    <title>My Garage</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .car-card { 
            background: white/60;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 24px;
            overflow: visible;
            box-shadow: 0 20px 40px -10px rgba(0,0,0,0.05);
            transition: all 0.2s ease;
            position: relative;
        }
        .car-card:hover { transform: translateY(-4px); box-shadow: 0 25px 50px -12px rgba(0,0,0,0.1); }
        .car-card.active-car { border-color: #22c55e; background: rgba(240, 253, 244, 0.7); }

        .search-input {
            width: 100%; padding: 12px 20px; padding-left: 40px;
            border-radius: 99px; border: 1px solid rgba(255, 255, 255, 0.5);
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(12px);
            font-size: 15px; outline: none; transition: 0.2s;
        }
        .search-input:focus { background: rgba(255, 255, 255, 0.8); border-color: rgba(255, 255, 255, 0.7); }

        .modal-bg { background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); }

        #toast {
            position: fixed; top: 85px; left: 50%; transform: translateX(-50%) translateY(-20px);
            z-index: 10000; background: white; color: #111827; padding: 12px 24px;
            border-radius: 99px; font-weight: 600; font-size: 14px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            border: 1px solid #f3f4f6;
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); pointer-events: none;
            display: flex; align-items: center; gap: 10px;
        }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>

    <!-- Auth Guard (Run Early) -->
    <script src="../JS/auth_guard.js"></script>
    <script>requireRole(['user']);</script>
</head>

<body class="h-screen bg-gradient-to-br from-[#F0F4F8] to-[#D9E2EC] text-slate-900 overflow-hidden flex flex-col">

<header class="flex-none z-30 bg-white/30 backdrop-blur-[20px] border-b border-white/40 shadow-[0_10px_30px_rgba(0,0,0,0.06)]">
  <div class="mx-auto max-w-6xl h-[68px] px-4 flex items-center justify-between">
    <!-- Left: Navigation Tabs -->
    <nav class="flex items-center gap-1 h-full overflow-x-auto no-scrollbar">
      <a href="dashboard.html" class="h-full flex items-center border-b-[3px] border-transparent hover:border-black/20 text-sm font-medium text-gray-600 hover:text-gray-900 transition-colors px-3 whitespace-nowrap">Dashboard</a>
      <a href="trip_planner.html" class="h-full flex items-center border-b-[3px] border-transparent hover:border-black/20 text-sm font-medium text-gray-600 hover:text-gray-900 transition-colors px-3 whitespace-nowrap">Trip Planner</a>
      <a href="hubs.html" class="h-full flex items-center border-b-[3px] border-transparent hover:border-black/20 text-sm font-medium text-gray-600 hover:text-gray-900 transition-colors px-3 whitespace-nowrap">Charging Hub</a>
      <a href="profile.html" class="h-full flex items-center border-b-[3px] border-transparent hover:border-black/20 text-sm font-medium text-gray-600 hover:text-gray-900 transition-colors px-3 whitespace-nowrap">Profile</a>
    </nav>

    <!-- Right: User Block -->
    <div class="flex items-center gap-3 pl-4 shrink-0">
      <div class="text-right hidden sm:block">
        <div class="text-sm font-semibold text-gray-900 leading-tight" id="header-user-name">User</div>
        <div class="text-xs font-medium text-gray-500 mt-0.5" id="header-car-name">No Car Selected</div>
      </div>
      <img src="https://i.pravatar.cc/256?img=12" alt="Profile" class="h-10 w-10 rounded-full border border-white/60 shadow-sm object-cover" />
    </div>
  </div>
</header>

<div class="flex-1 overflow-y-auto min-h-0">
<main class="mx-auto max-w-6xl px-4 py-6 pb-6">

  <!-- Title Section -->
  <div class="mb-6">
    <h1 class="text-2xl font-bold tracking-tight text-gray-900">My Garage</h1>
    <p class="text-sm text-gray-600 mt-1">Manage your electric vehicles</p>
  </div>

  <!-- Search Bar -->
  <div class="mb-6 relative max-w-2xl">
    <i class="fa-solid fa-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
    <input type="text" id="car-search" class="search-input w-full" placeholder="Search by brand or model (Tesla Model 3, BYD Atto 3…)" oninput="handleSearch(this.value)">
    <div id="search-results" class="absolute w-full bg-white/95 backdrop-blur-md border border-white/50 mt-2 rounded-2xl shadow-2xl overflow-hidden hidden z-50 text-left"></div>
  </div>

  <!-- Cars Grid -->
  <section class="space-y-3">
    <div id="garage-grid" class="flex flex-col gap-3"></div>
  </section>

</main>
</div>

<!-- Specs Modal -->
<div id="spec-modal" class="fixed inset-0 modal-bg hidden z-[100] flex items-center justify-center p-4">
    <div class="bg-white/90 backdrop-blur-xl border border-white/50 w-full max-w-sm rounded-3xl shadow-2xl p-6 relative">
        <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 w-8 h-8 flex items-center justify-center transition">
            <i class="fa-solid fa-times text-lg"></i>
        </button>
        
        <div class="mb-6">
            <div class="flex items-center gap-2 mb-1">
                <div class="text-xs font-bold text-blue-600 uppercase tracking-widest" id="modal-brand">--</div>
                <div class="bg-gray-100 px-2 py-0.5 rounded text-[10px] font-bold text-gray-600" id="modal-year">--</div>
            </div>
            <h2 class="text-2xl font-black text-gray-900 leading-tight" id="modal-model">--</h2>
        </div>

        <div class="grid grid-cols-2 gap-3">
            <div class="bg-blue-50 border border-blue-100 p-3 rounded-xl">
                <div class="text-[10px] text-blue-600 font-bold uppercase">Official Range</div>
                <div class="text-xl font-black text-gray-900 mt-1"><span id="modal-range">--</span> <small class="text-xs">km</small></div>
            </div>
            <div class="bg-green-50 border border-green-100 p-3 rounded-xl">
                <div class="text-[10px] text-green-600 font-bold uppercase">Battery</div>
                <div class="text-xl font-black text-gray-900 mt-1"><span id="modal-batt">--</span> <small class="text-xs">kWh</small></div>
            </div>
            <div class="bg-yellow-50 border border-yellow-100 p-3 rounded-xl">
                <div class="text-[10px] text-yellow-700 font-bold uppercase">Real Range</div>
                <div class="text-xl font-black text-gray-900 mt-1"><span id="modal-real">--</span> <small class="text-xs">km</small></div>
            </div>
            <div class="bg-purple-50 border border-purple-100 p-3 rounded-xl">
                <div class="text-[10px] text-purple-600 font-bold uppercase">Plug Type</div>
                <div class="text-lg font-black text-gray-900 mt-1 truncate" id="modal-plug">--</div>
            </div>
        </div>
    </div>
</div>

<!-- Delete Modal -->
<div id="delete-modal" class="fixed inset-0 modal-bg hidden z-[110] flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-sm rounded-3xl shadow-2xl p-6 relative text-center">
        <button onclick="closeDeleteModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 w-8 h-8 flex items-center justify-center transition">
            <i class="fa-solid fa-times text-lg"></i>
        </button>
        <div class="w-14 h-14 bg-red-50 rounded-full flex items-center justify-center mx-auto mb-4 text-red-500">
            <i class="fa-regular fa-trash-can text-2xl"></i>
        </div>
        <h2 class="text-2xl font-black text-gray-900 mb-2">Remove Vehicle?</h2>
        <p class="text-sm text-gray-500 mb-6 leading-relaxed" id="delete-msg">
            Are you sure you want to remove this vehicle? This action cannot be undone.
        </p>
        
        <div class="flex gap-3">
            <button onclick="closeDeleteModal()" class="flex-1 py-3 border border-gray-200 rounded-xl font-bold text-sm text-gray-600 hover:bg-gray-50 transition">Cancel</button>
            <button onclick="confirmDelete()" id="confirm-delete-btn" class="flex-1 py-3 bg-red-600 hover:bg-red-700 text-white rounded-xl font-bold text-sm shadow-lg transition">Remove</button>
        </div>
    </div>
</div>

<div id="toast">
    <div class="w-8 h-8 rounded-full bg-green-100 flex items-center justify-center shrink-0">
        <i class="fa-solid fa-check text-green-600 text-sm"></i>
    </div>
    <span id="toast-msg">Success</span>
</div>

<script>
        const API_URL = "http://localhost/WEBPROG_PROJ/BACKEND/API/GARAGE/vehicles.php";
        const API_BASE = "http://localhost/WEBPROG_PROJ/BACKEND/API/GARAGE";
        const VEHICLE_API = `${API_BASE}/vehicles.php`;
        const FALLBACK_IMG = "https://placehold.co/600x400/EEE/31343C?text=EV+Image";
        const USER_ID = localStorage.getItem("user_id");
        let searchTimeout;
        let pendingDeleteId = null;
        
        // UNIT PREFERENCES
        const PREF_UNIT = localStorage.getItem('pref_units') || 'KM';
        const DIST_FACTOR = PREF_UNIT === 'MILES' ? 0.621371 : 1;
        const DIST_LABEL = PREF_UNIT === 'MILES' ? 'mi' : 'km';

        document.addEventListener("DOMContentLoaded", () => {
            renderGarage();
            
            // Update header info
            const fullName = localStorage.getItem('full_display_name') || localStorage.getItem('user_name') || 'User';
            const activeCar = JSON.parse(localStorage.getItem('active_car') || '{}');
            document.getElementById('header-user-name').textContent = fullName;
            document.getElementById('header-car-name').textContent = activeCar.brand && activeCar.model ? `${activeCar.brand} ${activeCar.model}` : 'No Car Selected';
        });

        // RESTORED OLD SEARCH LOGIC
        function handleSearch(query) {
            clearTimeout(searchTimeout);
            const dropdown = document.getElementById('search-results');
            
            if(query.length < 2) {
                dropdown.classList.add('hidden');
                return;
            }

            dropdown.innerHTML = '<div class="p-4 text-center text-gray-500"><i class="fa-solid fa-circle-notch fa-spin"></i> Searching...</div>';
            dropdown.classList.remove('hidden');

            searchTimeout = setTimeout(async () => {
                try {
                    const res = await fetch(`${VEHICLE_API}?q=${encodeURIComponent(query)}`);
                    const json = await res.json();
                    
                    dropdown.innerHTML = ''; 
                    const cars = Array.isArray(json) ? json : (json.data || []);

                    if(cars.length > 0) {
                        cars.forEach(car => {
                            const div = document.createElement('div');
                            div.className = "p-4 border-b border-gray-100 hover:bg-gray-50 cursor-pointer flex items-center justify-between transition";
                            div.innerHTML = `
                                <div class="flex items-center gap-4">
                                    <div>
                                        <div class="font-bold text-gray-900">${car.brand} ${car.model}</div>
                                        <div class="text-xs text-gray-500">${car.year} • ${Math.round(car.range_km * DIST_FACTOR)} ${DIST_LABEL}</div>
                                    </div>
                                </div>
                                <div class="text-blue-600 font-bold text-sm add-btn-text">+ Add</div>
                            `;
                            div.onclick = (e) => {
                                addCarWithFeedback(car, div.querySelector('.add-btn-text'));
                            };
                            dropdown.appendChild(div);
                        });
                    } else {
                        dropdown.innerHTML = `<div class="p-4 text-gray-400 text-center italic">No vehicles found.</div>`;
                    }
                } catch(e) {
                    console.error("Search Error", e);
                    dropdown.innerHTML = '<div class="p-4 text-red-500 text-center">Connection Error.</div>';
                }
            }, 300);
        }

        async function addCarWithFeedback(car, textElement) {
            if(textElement.dataset.adding) return;
            textElement.dataset.adding = "true";
            const originalText = textElement.innerText;
            textElement.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i>';
            
            const success = await addToGarage(car);
            
            if(success) {
                textElement.innerHTML = '<i class="fa-solid fa-check"></i> Added';
                textElement.classList.remove('text-blue-600');
                textElement.classList.add('text-green-600');
                setTimeout(() => {
                    document.getElementById('search-results').classList.add('hidden');
                    document.getElementById('car-search').value = '';
                }, 1000);
            } else {
                textElement.innerText = originalText;
                delete textElement.dataset.adding;
            }
        }

        async function addToGarage(car) {
            try {
                const res = await fetch(`${API_BASE}/user_garage.php`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        user_id: USER_ID,
                        nickname: `${car.brand} ${car.model}`,
                        brand: car.brand,
                        model: car.model,
                        year: car.year,
                        battery_kwh: car.battery_kwh,
                        efficiency_whkm: car.efficiency_whkm,
                        image: car.image,
                        plug_type: car.plug_type
                    })
                });
                const json = await res.json();
                
                if (json.ok) {
                    renderGarage();
                    return true;
                } else {
                    alert(json.error || "Failed to add car");
                    return false;
                }
            } catch (e) {
                console.error(e);
                alert("Connection Error");
                return false;
            }
        }

        async function renderGarage() {
            const grid = document.getElementById('garage-grid');
            grid.innerHTML = '';
            
            try {
                const res = await fetch(`${API_BASE}/get_user_garage.php?user_id=${USER_ID}`);
                const json = await res.json();
                const garage = json.data || [];

                // Sort active car to top
                garage.sort((a, b) => (b.is_active == 1) - (a.is_active == 1));

                if(garage.length === 0) {
                    grid.innerHTML = '<div class="text-center py-10 text-gray-400 italic">No vehicles yet. Search above to add cars to your garage.</div>';
                    localStorage.removeItem('active_car'); // Clear local active car if garage empty
                    return;
                }

                garage.forEach(car => {
                    const isActive = car.is_active == 1;
                    if (isActive) {
                        // Sync local storage with DB truth
                        localStorage.setItem('active_car', JSON.stringify(car));
                        localStorage.setItem('ev_max_range', car.range_km);
                    }

                    const div = document.createElement('div');
                    div.className = `car-card p-5 flex items-center justify-between gap-4 ${isActive ? 'active-car' : ''}`;
                    
                    // Escape quotes for HTML attributes
                    const carJson = JSON.stringify(car).replace(/"/g, '&quot;');

                    div.innerHTML = `
                        <div class="flex-1">
                            <div class="flex items-center gap-2">
                                <h3 class="font-bold text-base text-gray-900">${car.brand} ${car.model}</h3>
                                ${isActive ? `<span class="bg-green-100 text-green-700 text-[10px] font-bold px-2 py-0.5 rounded-full border border-green-200 uppercase tracking-wide">Active</span>` : ''}
                            </div>
                            <div class="text-sm text-gray-500 mt-0.5">${car.year} • ${Math.round(car.range_km * DIST_FACTOR)} ${DIST_LABEL}</div>
                        </div>
                        
                        <div class="flex items-center gap-2 shrink-0">
                            ${!isActive ? `<button onclick='setActiveCar(${carJson}, this)' class="px-4 py-2 bg-slate-900 text-white rounded-lg font-bold text-xs shadow-sm hover:shadow-md transition active:scale-95">Set Active</button>` : ''}
                            
                            <button onclick="openSpecModal(${carJson})" 
                                    class="w-8 h-8 rounded-full flex items-center justify-center bg-gray-100 text-gray-600 hover:bg-gray-200 transition"
                                    title="View Specs">
                                <i class="fa-solid fa-ellipsis-vertical text-sm"></i>
                            </button>

                            <button onclick="deleteCar('${car.garage_id}', '${car.brand} ${car.model}')" 
                                    class="w-8 h-8 rounded-full flex items-center justify-center bg-red-100 text-red-600 hover:bg-red-200 transition"
                                    title="Remove Vehicle">
                                <i class="fa-regular fa-trash-can text-sm"></i>
                            </button>
                        </div>
                    `;
                    grid.appendChild(div);
                });
            } catch (e) {
                console.error(e);
                grid.innerHTML = '<div class="text-center text-red-500 py-10">Failed to load garage.</div>';
            }
        }

        async function setActiveCar(car, btn) {
            if (btn) {
                btn.style.transition = "all 0.3s ease";
                btn.style.opacity = "0";
                btn.style.transform = "scale(0.9)";
                btn.style.pointerEvents = "none";
            }

            try {
                const res = await fetch(`${API_BASE}/set_active_car.php`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ user_id: USER_ID, garage_id: car.garage_id })
                });
                const json = await res.json();
                if (json.ok) {
                    if (btn) await new Promise(r => setTimeout(r, 300));
                    renderGarage();
                }
            } catch (e) { 
                console.error(e);
                if (btn) {
                    btn.style.opacity = "1";
                    btn.style.transform = "scale(1)";
                    btn.style.pointerEvents = "auto";
                }
            }
        }

        function openSpecModal(car) {
            document.getElementById('modal-brand').innerText = car.brand;
            document.getElementById('modal-model').innerText = car.model;
            document.getElementById('modal-year').innerText = car.year;
            
            document.getElementById('modal-range').innerText = Math.round(car.range_km * DIST_FACTOR);
            document.getElementById('modal-range').nextElementSibling.innerText = DIST_LABEL;
            
            document.getElementById('modal-batt').innerText = car.battery_kwh;
            document.getElementById('modal-real').innerText = Math.round((car.real_world_range_km || car.range_km * 0.85) * DIST_FACTOR);
            document.getElementById('modal-real').nextElementSibling.innerText = DIST_LABEL;
            
            document.getElementById('modal-plug').innerText = car.plug_type || 'Type 2';
            
            document.getElementById('spec-modal').classList.remove('hidden');
        }

        function deleteCar(garageId, carName) { 
            pendingDeleteId = garageId;
            const msg = carName ? `Are you sure you want to remove <span class="font-bold text-gray-900 dark:text-white">${carName}</span>?` : "Are you sure you want to remove this vehicle?";
            document.getElementById('delete-msg').innerHTML = msg + "<br>This action cannot be undone.";
            document.getElementById('delete-modal').classList.remove('hidden');
        }

        function closeDeleteModal() {
            document.getElementById('delete-modal').classList.add('hidden');
            pendingDeleteId = null;
        }

        async function confirmDelete() {
            if(!pendingDeleteId) return;
            const btn = document.getElementById('confirm-delete-btn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i>';
            btn.disabled = true;

            try {
                const res = await fetch(`${API_BASE}/delete_user_garage.php`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ garage_id: pendingDeleteId })
                });
                const json = await res.json();
                if (json.ok) {
                    renderGarage();
                    closeDeleteModal();
                    showToast("Vehicle removed successfully");
                }
            } catch (e) { console.error(e); }
            finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        function showToast(msg) {
            const t = document.getElementById("toast");
            const tm = document.getElementById("toast-msg");
            if (t && tm) {
                tm.textContent = msg;
                t.classList.add("show");
                setTimeout(() => t.classList.remove("show"), 3000);
            }
        }

        function closeModal() { document.getElementById('spec-modal').classList.add('hidden'); }
        window.onclick = (event) => {
            if(event.target.id === 'spec-modal') closeModal();
            if(event.target.id === 'delete-modal') closeDeleteModal();
        };
    </script>
</body>
</html>
