<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Garage</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Apply Dark Mode immediately from Profile preferences
        if (localStorage.getItem('pref_dark') === 'true') {
            document.documentElement.classList.add('dark');
        }
        tailwind.config = { darkMode: 'class' };
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { background: #f3f4f6; font-family: 'Segoe UI', sans-serif; transition: 0.3s; }
        .car-card { 
            background: white; border-radius: 20px; overflow: visible;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            transition: all 0.2s ease; border: 2px solid transparent;
            position: relative;
        }
        .car-card:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(0,0,0,0.1); }
        .car-card.active-car { border-color: #22c55e; background: #f0fdf4; }

        .search-wrap { position: relative; max-width: 600px; margin: 0 auto; }
        .search-input {
            width: 100%; padding: 16px 24px; padding-left: 50px;
            border-radius: 99px; border: none;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            font-size: 16px; outline: none; transition: 0.2s;
        }

        .modal-bg { background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); }
        
        .action-btn { 
            position: absolute; top: 10px; right: 10px; background: rgba(255, 255, 255, 0.95); 
            color: #4b5563; width: 32px; height: 32px; border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 20; 
        }
        .menu-dropdown { 
            position: absolute; top: 45px; right: 10px; background: white; border-radius: 12px; 
            z-index: 50; width: 140px; display: none; overflow: hidden; box-shadow: 0 10px 20px rgba(0,0,0,0.1); 
        }
        .menu-dropdown.show { display: block; }

        html.dark body { background: #0f172a; color: white; }
        html.dark .car-card { background: #1e293b; border-color: #334151; }
        html.dark .car-card.active-car { background: #064e3b; border-color: #10b981; }
        html.dark .bg-white { background: #1e293b; }
        html.dark .search-input { background: #1e293b; color: white; }
    </style>
</head>
<body class="pb-20">

    <div class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-black text-gray-900 dark:text-white flex items-center gap-2">
                <i class="fa-solid fa-warehouse text-blue-600"></i> My Garage
            </h1>
            
            <div class="flex items-center gap-4">
                <a href="dashboard.html" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-xl font-bold transition">
                    Dashboard
                </a>
            </div>
        </div>
    </div>

    <div class="max-w-4xl mx-auto px-4 mt-8">
        <div class="text-center mb-10">
            <h2 class="text-3xl font-bold dark:text-white mb-2">Find Your EV</h2>
            <div class="search-wrap relative max-w-lg mx-auto">
                <i class="fa-solid fa-search absolute left-5 top-1/2 -translate-y-1/2 text-gray-400 text-lg"></i>
                <input type="text" id="car-search" class="search-input" placeholder="e.g. Tesla, BYD, Nissan..." oninput="handleSearch(this.value)">
                <div id="search-results" class="absolute w-full bg-white dark:bg-slate-800 mt-2 rounded-2xl shadow-2xl overflow-hidden hidden z-50 text-left"></div>
            </div>
        </div>

        <div id="garage-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
    </div>

    <div id="spec-modal" class="fixed inset-0 modal-bg hidden z-[100] flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-800 w-full max-w-lg rounded-3xl overflow-hidden shadow-2xl relative">
            <button onclick="closeModal()" class="absolute top-4 right-4 bg-black/50 hover:bg-black text-white w-8 h-8 rounded-full flex items-center justify-center z-50">
                <i class="fa-solid fa-times"></i>
            </button>
            <div class="w-full h-64 bg-gray-100 relative">
                 <img id="modal-img" src="" class="w-full h-full object-cover">
            </div>
            <div class="p-8">
                <div class="flex justify-between items-start mb-6">
                    <div>
                        <div class="text-sm font-bold text-blue-600 uppercase tracking-widest" id="modal-brand">--</div>
                        <h2 class="text-3xl font-black text-gray-900 dark:text-white leading-none" id="modal-model">--</h2>
                    </div>
                    <div class="bg-gray-100 dark:bg-slate-700 px-3 py-1 rounded-lg font-bold text-gray-600 dark:text-gray-300" id="modal-year">--</div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-blue-50 dark:bg-blue-900/20 p-4 rounded-xl">
                        <div class="text-[10px] text-blue-500 font-bold uppercase">Official Range</div>
                        <div class="text-2xl font-black dark:text-white"><span id="modal-range">--</span> <small class="text-xs">km</small></div>
                    </div>
                    <div class="bg-green-50 dark:bg-green-900/20 p-4 rounded-xl">
                        <div class="text-[10px] text-green-500 font-bold uppercase">Battery</div>
                        <div class="text-2xl font-black dark:text-white"><span id="modal-batt">--</span> <small class="text-xs">kWh</small></div>
                    </div>
                    <div class="bg-yellow-50 dark:bg-yellow-900/20 p-4 rounded-xl">
                        <div class="text-[10px] text-yellow-600 font-bold uppercase">Real Range</div>
                        <div class="text-2xl font-black dark:text-white"><span id="modal-real">--</span> <small class="text-xs">km</small></div>
                    </div>
                    <div class="bg-purple-50 dark:bg-purple-900/20 p-4 rounded-xl">
                        <div class="text-[10px] text-purple-500 font-bold uppercase">Plug Type</div>
                        <div class="text-lg font-black dark:text-white truncate" id="modal-plug">--</div>
                    </div>
                </div>
                <button id="btn-activate" class="w-full mt-6 py-4 bg-gray-900 dark:bg-blue-600 text-white rounded-xl font-bold shadow-lg transition active:scale-95">Set as Active Car</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "http://localhost/WEBPROG_PROJ/BACKEND/API/GARAGE/vehicles.php";
        const API_BASE = "http://localhost/WEBPROG_PROJ/BACKEND/API/GARAGE";
        const VEHICLE_API = `${API_BASE}/vehicles.php`;
        const FALLBACK_IMG = "https://placehold.co/600x400/EEE/31343C?text=EV+Image";
        const USER_ID = localStorage.getItem("user_id");
        let searchTimeout;
        
        // UNIT PREFERENCES
        const PREF_UNIT = localStorage.getItem('pref_units') || 'KM';
        const DIST_FACTOR = PREF_UNIT === 'MILES' ? 0.621371 : 1;
        const DIST_LABEL = PREF_UNIT === 'MILES' ? 'mi' : 'km';

        document.addEventListener("DOMContentLoaded", () => {
            if(!localStorage.getItem("user_id")) window.location.href = "login.html";
            if(!USER_ID) window.location.href = "login.html";
            renderGarage();
        });

        // RESTORED OLD SEARCH LOGIC
        function handleSearch(query) {
            clearTimeout(searchTimeout);
            const dropdown = document.getElementById('search-results');
            
            if(query.length < 2) {
                dropdown.classList.add('hidden');
                return;
            }

            dropdown.innerHTML = '<div class="p-4 text-center text-gray-500"><i class="fa-solid fa-circle-notch fa-spin"></i> Searching...</div>';
            dropdown.classList.remove('hidden');

            searchTimeout = setTimeout(async () => {
                try {
                    const res = await fetch(`${VEHICLE_API}?q=${encodeURIComponent(query)}`);
                    const json = await res.json();
                    
                    dropdown.innerHTML = ''; 
                    const cars = Array.isArray(json) ? json : (json.data || []);

                    if(cars.length > 0) {
                        cars.forEach(car => {
                            const div = document.createElement('div');
                            div.className = "p-4 border-b dark:border-slate-700 hover:bg-gray-50 dark:hover:bg-slate-700 cursor-pointer flex items-center justify-between transition";
                            div.innerHTML = `
                                <div class="flex items-center gap-4">
                                    <img src="${car.image}" onerror="this.src='${FALLBACK_IMG}'" class="w-12 h-12 rounded-lg object-cover bg-gray-200">
                                    <div>
                                        <div class="font-bold text-gray-900 dark:text-white">${car.brand} ${car.model}</div>
                                        <div class="text-xs text-gray-500">${car.year} • ${Math.round(car.range_km * DIST_FACTOR)} ${DIST_LABEL}</div>
                                    </div>
                                </div>
                                <div class="text-blue-600 font-bold text-sm add-btn-text">+ Add</div>
                            `;
                            div.onclick = (e) => {
                                addCarWithFeedback(car, div.querySelector('.add-btn-text'));
                            };
                            dropdown.appendChild(div);
                        });
                    } else {
                        dropdown.innerHTML = `<div class="p-4 text-gray-400 text-center italic">No vehicles found.</div>`;
                    }
                } catch(e) {
                    console.error("Search Error", e);
                    dropdown.innerHTML = '<div class="p-4 text-red-500 text-center">Connection Error.</div>';
                }
            }, 300);
        }

        async function addCarWithFeedback(car, textElement) {
            if(textElement.dataset.adding) return;
            textElement.dataset.adding = "true";
            const originalText = textElement.innerText;
            textElement.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i>';
            
            const success = await addToGarage(car);
            
            if(success) {
                textElement.innerHTML = '<i class="fa-solid fa-check"></i> Added';
                textElement.classList.remove('text-blue-600');
                textElement.classList.add('text-green-600');
                setTimeout(() => {
                    document.getElementById('search-results').classList.add('hidden');
                    document.getElementById('car-search').value = '';
                }, 1000);
            } else {
                textElement.innerText = originalText;
                delete textElement.dataset.adding;
            }
        }

        async function addToGarage(car) {
            try {
                const res = await fetch(`${API_BASE}/user_garage.php`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        user_id: USER_ID,
                        nickname: `${car.brand} ${car.model}`,
                        brand: car.brand,
                        model: car.model,
                        year: car.year,
                        battery_kwh: car.battery_kwh,
                        efficiency_whkm: car.efficiency_whkm,
                        image: car.image,
                        plug_type: car.plug_type
                    })
                });
                const json = await res.json();
                
                if (json.ok) {
                    renderGarage();
                    return true;
                } else {
                    alert(json.error || "Failed to add car");
                    return false;
                }
            } catch (e) {
                console.error(e);
                alert("Connection Error");
                return false;
            }
        }

        async function renderGarage() {
            const grid = document.getElementById('garage-grid');
            grid.innerHTML = '';
            
            try {
                const res = await fetch(`${API_BASE}/get_user_garage.php?user_id=${USER_ID}`);
                const json = await res.json();
                const garage = json.data || [];

                if(garage.length === 0) {
                    grid.innerHTML = '<div class="col-span-full text-center py-10 text-gray-400 italic">Garage empty. Search to add cars.</div>';
                    localStorage.removeItem('active_car'); // Clear local active car if garage empty
                    return;
                }

                garage.forEach(car => {
                    const isActive = car.is_active == 1;
                    if (isActive) {
                        // Sync local storage with DB truth
                        localStorage.setItem('active_car', JSON.stringify(car));
                        localStorage.setItem('ev_max_range', car.range_km);
                    }

                    const div = document.createElement('div');
                    div.className = `car-card p-6 ${isActive ? 'active-car' : ''}`;
                    div.innerHTML = `
                        <div class="action-btn dark:bg-slate-700 dark:text-white" onclick="toggleMenu(event, '${car.garage_id}')"><i class="fa-solid fa-ellipsis-vertical"></i></div>
                        <div id="menu-${car.garage_id}" class="menu-dropdown dark:bg-slate-800 dark:border-slate-700">
                            <div class="p-3 text-red-500 font-bold cursor-pointer hover:bg-red-50 dark:hover:bg-red-900/10" onclick="deleteCar('${car.garage_id}')">Delete</div>
                        </div>
                        <img src="${car.image}" onerror="this.src='${FALLBACK_IMG}'" class="w-full h-40 object-contain mb-4">
                        <h3 class="font-black text-xl dark:text-white">${car.brand} ${car.model}</h3>
                        <div class="flex gap-2 mt-4">
                            <button onclick='openSpecModal(${JSON.stringify(car)})' class="flex-1 py-3 bg-gray-100 dark:bg-slate-700 dark:text-white rounded-xl font-bold text-sm">Specs</button>
                            <button onclick='setActiveCar(${JSON.stringify(car)})' class="flex-1 py-3 ${isActive ? 'bg-green-500' : 'bg-gray-900 dark:bg-blue-600'} text-white rounded-xl font-bold text-sm">${isActive ? 'Active' : 'Activate'}</button>
                        </div>
                    `;
                    grid.appendChild(div);
                });
            } catch (e) {
                console.error(e);
                grid.innerHTML = '<div class="col-span-full text-center text-red-500">Failed to load garage.</div>';
            }
        }

        async function setActiveCar(car) {
            try {
                const res = await fetch(`${API_BASE}/set_active_car.php`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ user_id: USER_ID, garage_id: car.garage_id })
                });
                const json = await res.json();
                if (json.ok) {
                    renderGarage(); // Re-render to update UI
                }
            } catch (e) { console.error(e); }
        }

        function openSpecModal(car) {
            document.getElementById('modal-img').src = car.image;
            document.getElementById('modal-brand').innerText = car.brand;
            document.getElementById('modal-model').innerText = car.model;
            document.getElementById('modal-year').innerText = car.year;
            
            document.getElementById('modal-range').innerText = Math.round(car.range_km * DIST_FACTOR);
            document.getElementById('modal-range').nextElementSibling.innerText = DIST_LABEL;
            
            document.getElementById('modal-batt').innerText = car.battery_kwh;
            document.getElementById('modal-real').innerText = Math.round((car.real_world_range_km || car.range_km * 0.85) * DIST_FACTOR);
            document.getElementById('modal-real').nextElementSibling.innerText = DIST_LABEL;
            
            document.getElementById('modal-plug').innerText = car.plug_type || 'Type 2';
            document.getElementById('btn-activate').onclick = () => { setActiveCar(car); closeModal(); };
            document.getElementById('spec-modal').classList.remove('hidden');
        }

        function toggleMenu(e, id) { e.stopPropagation(); document.getElementById(`menu-${id}`).classList.toggle('show'); }
        
        async function deleteCar(garageId) { 
            if(!confirm("Delete this car?")) return;
            try {
                const res = await fetch(`${API_BASE}/delete_user_garage.php`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ garage_id: garageId })
                });
                const json = await res.json();
                if (json.ok) renderGarage();
            } catch (e) { console.error(e); }
        }

        function closeModal() { document.getElementById('spec-modal').classList.add('hidden'); }
        window.onclick = () => {
            document.querySelectorAll('.menu-dropdown').forEach(m => m.classList.remove('show'));
            if(event.target.id === 'spec-modal') closeModal();
        };
    </script>
</body>
</html>
