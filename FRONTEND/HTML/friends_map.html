    <!-- FRIEND DETAILS MODAL -->
    <div id="details-modal" class="hidden fixed inset-0 z-[2000] flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm">
        <div class="bg-white w-full max-w-sm rounded-2xl shadow-2xl overflow-hidden flex flex-col">
            <div class="p-4 border-b border-gray-100 flex justify-between items-center bg-gray-50">
                <h3 class="font-black text-lg text-gray-800 truncate pr-4" id="detail-title">Friend Details</h3>
                <button onclick="closeDetailsModal()" class="w-8 h-8 rounded-full bg-white hover:bg-gray-200 flex items-center justify-center transition text-gray-500"><i class="fa-solid fa-times"></i></button>
            </div>

        </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Use localhost to match login.js and ensure session consistency
        const API_BASE = "http://localhost/WEBPROG_PROJ/BACKEND/API/FRIENDS";
        const SOCKET_URL = "http://localhost:3000";
        const USER_ID = localStorage.getItem("user_id");
        
        let map, socket;
        let markers = {};
        let myMarker = null;
        let friendsData = [];
        let myLat = 14.5995, myLng = 120.9842; // Default
        let watchId = null;
        let hasLocation = false;

        document.addEventListener("DOMContentLoaded", () => {
            if(!USER_ID) window.location.href = 'login.html';
            
            // Init Map
            const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 });
            const satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 });
            
            map = L.map('map', { zoomControl: false, layers: [osm] }).setView([myLat, myLng], 13);
            L.control.zoom({ position: 'bottomright' }).addTo(map);
            L.control.layers({ "Map": osm, "Satellite": satellite }, null, { position: 'topright' }).addTo(map);

            loadFriendsAndRequests();
            initSocket();
            
            // Check for Email Invite Link
            const urlParams = new URLSearchParams(window.location.search);
            const inviteId = urlParams.get('accept_invite');
            if (inviteId) {
                acceptRequest(inviteId);
                window.history.replaceState({}, document.title, window.location.pathname); // Clean URL
            }
        });

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('tab-friends').classList.add('hidden');
            document.getElementById('tab-add').classList.add('hidden');
            document.getElementById('tab-requests').classList.add('hidden');
            document.getElementById(`tab-${tab}`).classList.remove('hidden');
        }

        async function loadFriendsAndRequests() {
            try {
                console.log(`Fetching friends from: ${API_BASE}/list.php?user_id=${USER_ID}`);
                const res = await fetch(`${API_BASE}/list.php?user_id=${USER_ID}`);
                const data = await res.json();
                
                // Render Friends
                const fList = document.getElementById('friends-list');
                fList.innerHTML = '';
                friendsData = data.friends || [];
                
                if(friendsData.length === 0) fList.innerHTML = '<div class="text-center text-gray-400 py-4 text-sm">No friends yet. Add some!</div>';
                
                friendsData.forEach(f => {
                    fList.innerHTML += `
                        <div class="list-item hover:bg-gray-50 cursor-pointer" onclick="focusFriend(${f.id})">
                            <div class="flex items-center gap-3">
                                <div class="w-8 h-8 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center font-bold text-xs">${f.name.charAt(0)}</div>
                                <div>
                                    <div class="font-bold text-sm text-gray-800">${f.name}</div>
                                    <div class="text-xs text-gray-400">@${f.username}</div>
                                </div>
                            </div>
                            <div class="text-xs text-gray-400 font-bold" id="status-${f.id}">Offline</div>
                        </div>`;
                    
                    // Tell socket to watch this friend
                    if(socket && socket.connected) socket.emit('watch_friend', f.id);
                });

                // Render Requests
                const rList = document.getElementById('requests-list');
                rList.innerHTML = '';
                const reqs = data.requests || [];
                
                if(reqs.length === 0) rList.innerHTML = '<div class="text-center text-gray-400 py-4 text-sm">No pending requests.</div>';
                
                reqs.forEach(r => {
                    rList.innerHTML += `
                        <div class="list-item">
                            <div class="font-bold text-sm text-gray-800">${r.name}</div>
                            <button onclick="acceptRequest(${r.friendship_id})" class="bg-green-500 text-white px-3 py-1 rounded text-xs font-bold">Accept</button>
                        </div>`;
                });

            } catch(e) { console.error("Load Friends Error:", e); }
        }

        async function searchUsers() {
            const q = document.getElementById('search-input').value;
            const box = document.getElementById('search-results');
            box.innerHTML = '<div class="text-center text-gray-400 py-4 text-sm"><i class="fa-solid fa-circle-notch fa-spin"></i> Searching...</div>';
            
            try {
                const res = await fetch(`${API_BASE}/search.php`, {
                    method: 'POST', headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({ query: q, user_id: USER_ID })
                });

                const text = await res.text();
                let data;
                try { data = JSON.parse(text); } catch (e) { throw new Error("Server returned invalid JSON."); }

                if (!res.ok) throw new Error("API Error: " + res.status);
                
                box.innerHTML = '';
                if(data.users.length === 0) box.innerHTML = '<div class="text-gray-400 text-sm">No users found.</div>';
                
                data.users.forEach(u => {
                    box.innerHTML += `
                        <div class="list-item">
                            <div class="text-sm font-bold">${u.name} <span class="text-gray-400 font-normal">(@${u.username})</span></div>
                            <button onclick="sendRequest(${u.id}, this)" class="bg-blue-600 text-white px-3 py-1 rounded text-xs font-bold hover:bg-blue-700 transition">Add</button>
                        </div>`;
                });
            } catch (e) {
                console.error("Search Error:", e);
                box.innerHTML = '<div class="text-center text-red-400 py-4 text-sm">Search failed. Check connection.</div>';
            }
        }

        async function sendRequest(receiverId, btn) {
            const originalText = btn.innerText;
            btn.innerText = "Sending...";
            btn.disabled = true;

            try {
                const res = await fetch(`${API_BASE}/request.php`, {
                    method: 'POST', headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({ requester_id: USER_ID, receiver_id: receiverId })
                });
                const data = await res.json();

                if (data.ok) {
                    btn.innerText = "Request Sent";
                    btn.classList.remove("bg-blue-600", "hover:bg-blue-700");
                    btn.classList.add("bg-gray-400", "cursor-not-allowed");
                    if (data.debug_link) console.log("📧 DEBUG Link:", data.debug_link);
                } else {
                    alert(data.error || "Failed to send request");
                    btn.innerText = originalText;
                    btn.disabled = false;
                }
            } catch (e) {
                alert("Connection Error");
                btn.innerText = originalText;
                btn.disabled = false;
            }
        }

        async function acceptRequest(id) {
            await fetch(`${API_BASE}/accept.php`, {
                method: 'POST', headers: {'Content-Type':'application/json'},
                body: JSON.stringify({ friendship_id: id })
            });
            alert("Friend request accepted!");
            loadFriendsAndRequests();
        }

        function initSocket() {
            try {
                socket = io(SOCKET_URL);
                
                socket.on("connect", () => {
                    console.log("Socket Connected");
                    document.getElementById('socket-status').classList.add('connected');
                    document.getElementById('socket-status').title = "Connected";
                    
                    socket.emit("register", USER_ID);
                    friendsData.forEach(f => socket.emit('watch_friend', f.id));
                    startTracking();
                });

                socket.on("disconnect", () => {
                    document.getElementById('socket-status').classList.remove('connected');
                });

                socket.on("friend_moved", (data) => {
                    updateFriendMarker(data);
                });

                socket.on("sos_alert", (data) => {
                    handleSOS(data);
                });
            } catch(e) {
                console.error("Socket Init Error. Is node server running?", e);
            }
        }

        function startTracking() {
            if(!navigator.geolocation) {
                console.error("Geolocation not supported");
                return;
            }
            
            if (watchId !== null) navigator.geolocation.clearWatch(watchId);

            // 1. Force Immediate Update (Fixes "Offline" status on load)
            navigator.geolocation.getCurrentPosition(pos => {
                myLat = pos.coords.latitude;
                myLng = pos.coords.longitude;
                updateMyMarker(myLat, myLng);
                if(socket && socket.connected) socket.emit("update_location", { lat: myLat, lng: myLng });
            }, err => console.warn("Initial GPS failed:", err));

            // 2. Start Watching for Movement
            watchId = navigator.geolocation.watchPosition((pos) => {
                myLat = pos.coords.latitude;
                myLng = pos.coords.longitude;
                updateMyMarker(myLat, myLng);

                // Send to server
                if(socket && socket.connected) socket.emit("update_location", { lat: myLat, lng: myLng });
            }, (err) => {
                console.warn("GPS Watch Error:", err);
            }, { enableHighAccuracy: true, maximumAge: 10000, timeout: 10000 });

            const btn = document.getElementById('share-btn');
            if(btn) {
                btn.innerText = "Stop Sharing";
                btn.className = "text-[10px] uppercase font-bold text-red-500 hover:text-red-700 border border-red-200 px-2 py-1 rounded";
            }
            document.getElementById('socket-status').classList.add('connected');
        }

        function updateMyMarker(lat, lng) {
            if(myMarker) {
                myMarker.setLatLng([lat, lng]);
            } else {
                const meIcon = L.divIcon({
                    className: '',
                    html: '<div style="width: 16px; height: 16px; background: #2563eb; border: 3px solid white; border-radius: 50%; box-shadow: 0 0 10px rgba(0,0,0,0.3);"></div>',
                    iconSize: [16, 16]
                });
                myMarker = L.marker([lat, lng], { icon: meIcon, zIndexOffset: 1000 }).addTo(map).bindPopup("You");
            }

            if (!hasLocation) {
                map.setView([lat, lng], 16);
                hasLocation = true;
            }
        }

        function toggleSharing() {
            const btn = document.getElementById('share-btn');
            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
                btn.innerText = "Share Loc";
                btn.className = "text-[10px] uppercase font-bold text-green-500 hover:text-green-700 border border-green-200 px-2 py-1 rounded";
                document.getElementById('socket-status').classList.remove('connected');
            } else {
                startTracking();
            }
        }

        // DEBUG: Simulate movement to separate markers on same device
        function simulateMovement() {
            if(!socket) return alert("Socket not connected");
            // Add random offset (approx 50-100 meters)
            const offsetLat = (Math.random() - 0.5) * 0.002;
            const offsetLng = (Math.random() - 0.5) * 0.002;
            
            const fakeLat = myLat + offsetLat;
            const fakeLng = myLng + offsetLng;
            
            console.log("Simulating move to:", fakeLat, fakeLng);
            socket.emit("update_location", { lat: fakeLat, lng: fakeLng });
            
            // Move my marker too just to show it happened
            if(myMarker) myMarker.setLatLng([fakeLat, fakeLng]).bindPopup("Simulated Location").openPopup();
        }

        function updateFriendMarker(data) {
            const friend = friendsData.find(f => f.id == data.userId);
            if(!friend) return;

            const statusEl = document.getElementById(`status-${friend.id}`);
            if(statusEl) {
                statusEl.innerText = "Online";
                statusEl.className = "text-xs text-blue-600 font-bold animate-pulse";
            }

            // Format Time
            const time = data.timestamp ? new Date(data.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : 'Just now';
            const tooltipContent = `<div class="text-center font-sans"><b>${friend.name}</b><br><span class="text-[10px] text-gray-500">${time}</span></div>`;

            if(markers[data.userId]) {
                markers[data.userId].setLatLng([data.lat, data.lng]);
                
                markers[data.userId].setTooltipContent(tooltipContent);

                // Trigger Pulse Animation
                const el = markers[data.userId].getElement();
                if (el) {
                    el.classList.remove('marker-move');
                    void el.offsetWidth; // Trigger reflow to restart animation
                    el.classList.add('marker-move');
                }

                markers[data.userId].off('click');
                markers[data.userId].on('click', () => openFriendModal(friend, data.lat, data.lng, data.timestamp));
            } else {
                const icon = L.divIcon({
                    className: 'friend-marker',
                    html: `<div class="avatar">${friend.name.charAt(0)}</div><div class="label">${friend.name}</div>`,
                    iconSize: [40, 60], iconAnchor: [20, 60]
                });
                markers[data.userId] = L.marker([data.lat, data.lng], { icon }).addTo(map);
                
                // Add Tooltip on Hover
                markers[data.userId].bindTooltip(tooltipContent, { direction: 'top', offset: [0, -50] });
                
                // Pulse on appear
                setTimeout(() => {
                    const el = markers[data.userId].getElement();
                    if(el) el.classList.add('marker-move');
                }, 100);

                markers[data.userId].on('click', () => openFriendModal(friend, data.lat, data.lng, data.timestamp));
            }
        }

        function handleSOS(data) {
            // 1. Visual Alert
            const alertDiv = document.createElement('div');
            alertDiv.className = "fixed top-4 left-1/2 -translate-x-1/2 bg-red-600 text-white px-6 py-4 rounded-2xl shadow-2xl z-[3000] flex items-center gap-4 animate-bounce cursor-pointer";
            alertDiv.innerHTML = `<i class="fa-solid fa-triangle-exclamation text-2xl"></i> <div><div class="font-black text-lg">SOS ALERT</div><div class="text-sm">${data.name} needs help!</div></div>`;
            alertDiv.onclick = () => {
                map.flyTo([data.lat, data.lng], 18);
                alertDiv.remove();
            };
            document.body.appendChild(alertDiv);

            // 2. Update Marker Style
            if(markers[data.userId]) {
                const el = markers[data.userId].getElement();
                if(el) el.classList.add('sos-marker');
                markers[data.userId].setLatLng([data.lat, data.lng]);
                markers[data.userId].openPopup();
            }
        }

        function focusFriend(id) {
            if(markers[id]) {
                map.flyTo(markers[id].getLatLng(), 16);
                markers[id].fire('click');
            }
            else alert("Friend location not yet received. They might be offline.");
        }

        function openFriendModal(friend, lat, lng, timestamp) {
            document.getElementById('detail-title').innerText = friend.name;
            
            const timeStr = timestamp ? new Date(timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : 'Just now';
            
            const content = `
                <div class="text-center mb-4">
                    <div class="w-20 h-20 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center font-bold text-3xl mx-auto mb-3 shadow-inner">
                        ${friend.name.charAt(0)}
                    </div>
                    <div class="font-bold text-gray-900 text-xl">${friend.name}</div>
                    <div class="text-gray-500">@${friend.username}</div>
                    <div class="text-xs text-gray-400 mt-1 font-semibold"><i class="fa-regular fa-clock"></i> Last Seen: ${timeStr}</div>
                </div>
                
                <div class="bg-gray-50 p-4 rounded-xl border border-gray-100 mb-4">
                    <div class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Current Location</div>
                    <div class="font-mono text-xs text-gray-600">
                        Lat: ${lat.toFixed(6)}<br>
                        Lng: ${lng.toFixed(6)}
                    </div>
                </div>

                <button onclick="triggerNavigation('${friend.name.replace(/'/g, "\\'")}', ${lat}, ${lng})" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold shadow-lg flex items-center justify-center gap-2 transition transform active:scale-95">
                    <i class="fa-solid fa-location-arrow"></i> Navigate to Friend
                </button>
            `;
            
            document.getElementById('detail-content').innerHTML = content;
            document.getElementById('details-modal').classList.remove('hidden');
        }

        function closeDetailsModal() {
            document.getElementById('details-modal').classList.add('hidden');
        }

        function triggerNavigation(name, lat, lng) {
            const destination = { name: "Friend: " + name, lat, lng };
            localStorage.setItem('nav_destination', JSON.stringify(destination));
            window.location.href = 'trip_planner.html';
        }

        async function resetFriendships() {
            if(!confirm("⚠️ RESET WARNING\n\nDelete ALL friends?")) return;
            await fetch(`${API_BASE}/reset.php`);
            alert("Reset complete.");
            loadFriendsAndRequests();
        }
    </script>
</body>
