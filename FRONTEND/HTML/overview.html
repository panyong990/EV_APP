<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Overview Dashboard</title>

  <!-- Global + Page CSS -->
  <link rel="stylesheet" href="../CSS/style.css" />
  <link rel="stylesheet" href="../CSS/overview.css" />

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f9fafb;
      margin: 0;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    .sidebar {
      width: 260px;
      min-width: 260px;
      background-color: #ffffff;
      border-right: 1px solid #e5e7eb;
      display: flex;
      flex-direction: column;
      padding: 1.5rem 1rem;
      transition: width 0.3s ease, min-width 0.3s ease, padding 0.3s ease, opacity 0.3s ease;
      height: 100vh;
      overflow-y: auto;
    }
    .sidebar.hidden {
      width: 0 !important;
      min-width: 0 !important;
      padding: 0 !important;
      opacity: 0;
      overflow: hidden;
    }
    .sidebar-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0 0.5rem 1.5rem 0.5rem;
      margin-bottom: 0.5rem;
      border-bottom: 1px solid #f3f4f6;
    }
    .brand-logo {
      width: 32px;
      height: 32px;
      background: #000000;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      box-shadow: none;
    }
    .brand-name {
      font-size: 1.125rem;
      font-weight: 700;
      color: #111827;
      letter-spacing: -0.025em;
    }
    .sidebar-menu {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      flex: 1;
    }
    .menu-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.625rem 0.875rem;
      border-radius: 0.5rem;
      color: #6b7280;
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 500;
      transition: all 0.2s;
    }
    .menu-item:hover {
      background-color: #f3f4f6;
      color: #111827;
      transform: translateX(4px);
    }
    .menu-item.active {
      background-color: #eff6ff;
      color: #1d4ed8;
      font-weight: 600;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }
    .menu-icon {
      width: 1.25rem;
      height: 1.25rem;
      stroke-width: 2px;
    }
    .sidebar-footer {
      margin-top: auto;
      padding-top: 1rem;
      border-top: 1px solid #f3f4f6;
      margin-bottom: 2rem;
    }
    .logout-btn {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.625rem 0.875rem;
      border-radius: 0.5rem;
      color: #ef4444;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 0.875rem;
      font-weight: 500;
      transition: all 0.2s;
      text-align: left;
    }
    .logout-btn:hover {
      background-color: #fef2f2;
      transform: translateX(4px);
    }
    .main {
      flex: 1;
      padding: 2rem;
      transition: margin-left 0.3s ease, width 0.3s ease;
      overflow-y: auto;
    }
    .main.full-width {
      margin-left: 0;
      width: 100%;
    }
    #menu-btn {
      font-size: 1.5rem; cursor: pointer; background: none; border: none;
    }
    /* Dashboard Cards & Layout */
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }
    .charts {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
      margin-bottom: 2rem;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 0.75rem;
      padding: 1.5rem;
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .card:hover {
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }
    .card p {
      color: #6b7280;
      font-size: 0.9375rem;
      font-weight: 500;
      margin: 0 0 0.5rem 0;
      line-height: 1.5;
    }
    .card h2 {
      color: #111827;
      font-size: 1.75rem;
      font-weight: 700;
      margin: 0;
      letter-spacing: -0.025em;
      line-height: 1.1;
    }
    .card h3 {
      color: #111827;
      font-size: 1.25rem;
      font-weight: 600;
      margin: 0 0 1rem 0;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="brand-logo">
        <i data-lucide="zap" style="width: 18px; height: 18px;"></i>
      </div>
      <span class="brand-name">EnerGo</span>
    </div>
    
    <nav class="sidebar-menu">
      <a href="overview.html" class="menu-item active">
        <i data-lucide="layout-dashboard" class="menu-icon"></i>
        <span>Overview</span>
      </a>
      <a href="users.html" class="menu-item">
        <i data-lucide="users" class="menu-icon"></i>
        <span>Users</span>
      </a>
      <a href="analytics.html" class="menu-item">
        <i data-lucide="bar-chart-2" class="menu-icon"></i>
        <span>Analytics</span>
      </a>
      <a href="feedbacks.html" class="menu-item">
        <i data-lucide="message-square" class="menu-icon"></i>
        <span>User Feedbacks</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <button class="logout-btn" onclick="localStorage.clear(); window.location.href='login.html'">
        <i data-lucide="log-out" class="menu-icon"></i>
        <span>Log out</span>
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main">
    <div style="display: flex; align-items: center; gap: 1rem; padding-bottom: 1.5rem; border-bottom: 1px solid #e5e7eb; margin-bottom: 2rem;">
      <button id="menu-btn">&#9776;</button>
      <h1 style="margin: 0; font-size: 2rem; font-weight: 600; color: #111827; letter-spacing: -0.025em;">Dashboard Overview</h1>
    </div>

    <!-- Stats -->
    <section class="stats">
      <div class="card" style="background-color: #ecfdf5; border-color: #d1fae5;">
        <p style="color: #065f46;">Active Users</p>
        <h2 style="color: #064e3b;" id="activeUsersCount">--</h2>
      </div>
      <div class="card" style="background-color: #fffbeb; border-color: #fde68a;">
        <p style="color: #92400e;">Inactive Users</p>
        <h2 style="color: #78350f;" id="inactiveUsersCount">--</h2>
      </div>
      <div class="card" style="background-color: #f3f4f6; border-color: #e5e7eb;">
        <p style="color: #4b5563;">Unverified Users</p>
        <h2 style="color: #1f2937;" id="unverifiedUsersCount">--</h2>
      </div>
    </section>

    <!-- Charts -->
    <section class="charts">
      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1.5rem;">
          <div>
            <h3 style="margin: 0; font-size: 1.25rem; font-weight: 600; color: #111827;">User Growth</h3>
            <p style="margin: 0.25rem 0 0 0; font-size: 0.8125rem; color: #6b7280; font-weight: 400;">Monthly active users</p>
          </div>
          <div style="display: flex; align-items: center; gap: 0.5rem; background: #eff6ff; padding: 0.25rem 0.75rem; border-radius: 9999px;">
            <i data-lucide="trending-up" style="width: 16px; height: 16px; color: #2563eb;"></i>
            <span style="font-size: 0.875rem; font-weight: 600; color: #2563eb;">+12.5%</span>
          </div>
        </div>
        <div style="height: 320px; width: 100%;">
          <canvas id="growthChart"></canvas>
        </div>
      </div>
    </section>

    <!-- Sustainability -->
    <section class="stats">
      <div class="card">
        <p>Energy Used (kWh)</p>
        <h2 id="totalEnergyUsed">--</h2>
      </div>
      <div class="card">
        <p>CO₂ Saved (kg)</p>
        <h2 id="co2Saved">--</h2>
      </div>
      <div class="card">
        <p>Avg Energy Efficiency</p>
        <h2 id="avgEfficiency">--</h2>
      </div>
    </section>

    <!-- Recent Users -->
    <section class="charts">
      <div class="card">
        <h3 style="margin: 0 0 1rem 0; font-size: 1.25rem; font-weight: 600; color: #111827;">All Users</h3>
        <div style="overflow-x: auto;">
          <table style="width: 100%; border-collapse: collapse;">
            <thead>
              <tr style="border-bottom: 1px solid #e5e7eb;">
                <th style="text-align: left; padding: 12px 0; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.02em; color: #6b7280;">Name</th>
                <th style="text-align: left; padding: 12px 0; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.02em; color: #6b7280;">Email</th>
                <th style="text-align: center; padding: 12px 0; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.02em; color: #6b7280;">EVs</th>
                <th style="text-align: left; padding: 12px 0; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.02em; color: #6b7280;">Status</th>
                <th style="text-align: left; padding: 12px 0; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.02em; color: #6b7280;">Joined</th>
              </tr>
            </thead>
            <tbody id="recentUsersBody">
              <tr><td colspan="5" style="text-align: center; padding: 32px 12px; color: #6b7280;">Loading users...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <!-- Page JS -->
  <script src="../JS/auth_guard.js"></script>
  <script>try{ requireRole(['admin']); }catch(e){}</script>
  <script src="../JS/overview.js"></script>
  <script>
    const menuBtn = document.getElementById('menu-btn');
    const sidebar = document.querySelector('.sidebar');
    const main = document.querySelector('.main');

    menuBtn.addEventListener('click', () => {
      sidebar.classList.toggle('hidden');
      if(main) main.classList.toggle('full-width');
    });
    lucide.createIcons();
  </script>
</body>
</html>
