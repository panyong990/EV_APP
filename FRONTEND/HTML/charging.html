<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergency Charging</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; overflow: hidden; background: #111827; }
        #map { height: 100vh; width: 100%; z-index: 0; }
        
        .sidebar {
            position: absolute; top: 20px; left: 20px; bottom: 20px;
            width: 420px; max-width: 90vw;
            background: rgba(255, 255, 255, 0.98);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            z-index: 1000;
            display: flex; flex-direction: column;
            overflow: hidden;
            border: 4px solid #ef4444;
        }

        .station-card {
            border: 1px solid #e5e7eb; border-radius: 16px; padding: 16px; margin-bottom: 12px;
            cursor: pointer; transition: all 0.2s; background: white;
            position: relative;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02);
        }
        .station-card:hover { border-color: #ef4444; background: #fef2f2; transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(239, 68, 68, 0.1); }
        .station-card.selected { border: 2px solid #ef4444; background: #fee2e2; }
        
        /* Removed 'pointer-events: none' so you can always click even if disabled */
        .station-card.disabled { opacity: 0.7; background: #f3f4f6; filter: grayscale(1); }
        
        .badge { font-size: 10px; font-weight: 800; letter-spacing: 0.05em; padding: 4px 10px; border-radius: 99px; text-transform: uppercase; }
        .badge-green { background: #dcfce7; color: #166534; }
        .badge-gold { background: #fef3c7; color: #b45309; border: 1px solid #fcd34d; }

        .batt-input {
            background: transparent; border: none; font-weight: 900; font-size: 2.25rem;
            color: #111827; width: 80px; text-align: left; outline: none;
            border-bottom: 2px solid #e5e7eb; transition: 0.2s;
        }
        .batt-input:focus { border-color: #ef4444; }

        @keyframes pulse-red { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
        .emergency-pulse { animation: pulse-red 2s infinite; }

        .nav-overlay {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.8); color: white; padding: 10px 20px;
            border-radius: 99px; font-weight: bold; z-index: 999;
            display: none; box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .modal-bg {
            background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
            position: fixed; inset: 0; z-index: 2000;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        .modal-bg.active { opacity: 1; pointer-events: all; }
        
        .success-card {
            background: white; width: 90%; max-width: 400px;
            border-radius: 30px; padding: 40px 30px;
            text-align: center; transform: scale(0.9); transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .modal-bg.active .success-card { transform: scale(1); }
        
        .leaflet-control-layers { border-radius: 12px !important; box-shadow: 0 4px 10px rgba(0,0,0,0.2) !important; border: none !important; }
    </style>
</head>
<body>

    <div id="map"></div>
    <div id="nav-status" class="nav-overlay"><i class="fa-solid fa-circle-notch fa-spin"></i> Navigating to Charger...</div>

    <div class="sidebar" id="sidebar">
        <div class="p-6 pb-4 bg-red-50 border-b border-red-100">
            <div class="flex items-center gap-3 mb-2">
                <div class="w-3 h-3 rounded-full bg-red-600 emergency-pulse"></div>
                <h1 class="text-xl font-black text-red-700 uppercase tracking-wider">Emergency Mode</h1>
            </div>
            <div class="flex justify-between items-end">
                <div>
                    <div class="text-xs text-gray-500 font-bold uppercase mb-1">Current Battery</div>
                    <div class="flex items-baseline gap-1">
                        <input type="number" id="batt-input" class="batt-input" value="15" min="1" max="100" onchange="updateBatteryLevel(this.value)">
                        <span class="text-xl font-bold text-gray-400">%</span>
                    </div>
                </div>
                <div class="text-right">
                    <div class="text-xs text-gray-500 font-bold uppercase">Safe Range</div>
                    <div class="text-2xl font-bold text-blue-600" id="current-range-display">-- km</div>
                </div>
            </div>
            <button onclick="switchToHomeCharging()" class="mt-4 w-full py-2 bg-white border border-red-200 text-red-600 rounded-lg font-bold text-xs uppercase hover:bg-red-50 transition shadow-sm flex items-center justify-center gap-2">
                <i class="fa-solid fa-house-chimney"></i> I'm at Home / Have Charger
            </button>
        </div>

        <div id="content-area" class="flex-1 overflow-y-auto p-4 bg-gray-50 relative">
            <div class="flex flex-col h-full justify-center items-center text-gray-400">
                <i class="fa-solid fa-satellite-dish fa-spin text-3xl mb-3"></i>
                <p class="font-bold text-sm">Finding best chargers...</p>
            </div>
        </div>
    </div>

    <div id="finish-modal" class="modal-bg">
        <div class="success-card">
            <div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6">
                <i class="fa-solid fa-flag-checkered text-4xl text-green-600"></i>
            </div>
            <h2 class="text-3xl font-black text-gray-900 mb-2">Trip Finished!</h2>
            <p class="text-gray-500 mb-8 leading-relaxed">
                You have reached the station and recharged your EV.
            </p>
            <div class="bg-gray-50 rounded-2xl p-4 mb-8 flex justify-between items-center border border-gray-100">
                <div class="text-left">
                    <div class="text-xs font-bold text-gray-400 uppercase">New Battery</div>
                    <div class="text-2xl font-black text-gray-800" id="modal-final-batt">--%</div>
                </div>
                <div class="text-right">
                    <div class="text-xs font-bold text-gray-400 uppercase">Status</div>
                    <div class="text-green-600 font-bold"><i class="fa-solid fa-check-circle"></i> Ready</div>
                </div>
            </div>
            <button onclick="exitToPlanner()" class="w-full py-4 bg-gray-900 hover:bg-black text-white rounded-xl font-bold text-lg shadow-xl transition transform active:scale-95">
                Continue Journey
            </button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const API_URL = "http://localhost/WEBPROG_PROJ/BACKEND/API/CHARGING/nearby.php";
        
        const activeCar = JSON.parse(localStorage.getItem('active_car') || "{}");
        const CAR_SPECS = {
            capacity: parseFloat(localStorage.getItem('ev_capacity')) || activeCar.battery_kwh || 60.0,
            efficiency: parseInt(localStorage.getItem('ev_efficiency')) || activeCar.efficiency_whkm || 160, 
            safety_buffer: 0.85 
        };

        let map, userLat, userLng, currentBattery;
        let selectedStation = null;
        let routePolyline = null;
        let carMarker = null;
        let animationFrameId = null;
        let cachedStations = [];
        let processedStationsList = []; // New Global Array to hold processed data
        
        // UNIT PREFERENCES
        const PREF_UNIT = localStorage.getItem('pref_units') || 'KM';
        const DIST_FACTOR = PREF_UNIT === 'MILES' ? 0.621371 : 1;
        const DIST_LABEL = PREF_UNIT === 'MILES' ? 'mi' : 'km';

        const userIcon = L.divIcon({ html: '<div style="width:16px; height:16px; background:#3b82f6; border:3px solid white; border-radius:50%; box-shadow:0 0 10px rgba(0,0,0,0.5);"></div>', className: '' });
        const chargerIcon = L.divIcon({ html: '<div style="font-size:32px; filter:drop-shadow(0 4px 6px rgba(0,0,0,0.4)); cursor: pointer;">⚡</div>', className: '', iconSize: [30, 40], iconAnchor: [15, 40] });
        const carIcon = L.divIcon({ html: '<div style="font-size:30px; transform: rotate(0deg); filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));">🚗</div>', className: 'car-marker', iconSize: [30, 30], iconAnchor: [15, 15] });

        document.addEventListener("DOMContentLoaded", () => {
            let savedBatt = localStorage.getItem('last_known_battery');
            currentBattery = savedBatt ? parseInt(savedBatt) : 15;
            document.getElementById('batt-input').value = currentBattery;
            
            if (localStorage.getItem('ev_charging_mode') === 'home') {
                const streetLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 });
                map = L.map('map', { zoomControl: false, layers: [streetLayer] }).setView([14.5995, 120.9842], 13);
                switchToHomeCharging();
            } else {
                initMap();
            }
        });

        function calculateSafeRange(batteryPercent) {
            const remainingKwh = CAR_SPECS.capacity * (batteryPercent / 100);
            const theoreticalRange = (remainingKwh * 1000) / CAR_SPECS.efficiency;
            return theoreticalRange * CAR_SPECS.safety_buffer;
        }

        function updateBatteryLevel(val) {
            currentBattery = parseInt(val);
            if(currentBattery < 1) currentBattery = 1;
            if(currentBattery > 100) currentBattery = 100;
            if(cachedStations.length > 0) renderStationList(cachedStations);
        }

        function initMap() {
            const streetLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 });
            const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 });

            map = L.map('map', { zoomControl: false, layers: [streetLayer] }).setView([14.5995, 120.9842], 13);
            L.control.layers({ "Street View": streetLayer, "Satellite View": satelliteLayer }).addTo(map);
            
            if(navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(pos => {
                    userLat = pos.coords.latitude;
                    userLng = pos.coords.longitude;
                    L.marker([userLat, userLng], {icon: userIcon}).addTo(map);
                    map.setView([userLat, userLng], 14);
                    fetchAndFilterStations();
                }, () => {
                    userLat = 14.5995; userLng = 120.9842;
                    fetchAndFilterStations();
                });
            }
        }

        async function fetchAndFilterStations() {
            try {
                const res = await fetch(`${API_URL}?lat=${userLat}&lon=${userLng}`);
                cachedStations = await res.json(); 
                
                cachedStations = cachedStations.map(st => ({
                    ...st,
                    rating: (Math.random() * (5.0 - 3.5) + 3.5).toFixed(1),
                    reviews: Math.floor(Math.random() * 200) + 10
                }));

                if(cachedStations.length === 0) {
                    document.getElementById('content-area').innerHTML = `<div class="text-center p-4 text-red-500 font-bold">No stations found.</div>`;
                    return;
                }
                renderStationList(cachedStations);
            } catch(e) { console.error(e); }
        }

        function renderStationList(stations) {
            const safeRange = calculateSafeRange(currentBattery);
            document.getElementById('current-range-display').innerText = (safeRange * DIST_FACTOR).toFixed(1) + " " + DIST_LABEL;

            const container = document.getElementById('content-area');
            
            // Populate Global Array with processing
            processedStationsList = stations.map(st => {
                const dist = getDistance(userLat, userLng, st.location.latitude, st.location.longitude);
                return { ...st, distance: dist, reachable: dist <= safeRange };
            });

            // Sorting
            processedStationsList.sort((a, b) => {
                if (a.reachable !== b.reachable) return b.reachable - a.reachable;
                return a.distance - b.distance;
            });

            let html = `<div class="mb-4 flex justify-between items-end">
                            <span class="text-xs font-bold text-gray-400 uppercase">Best Stations</span>
                            <span class="text-xs text-blue-500 font-bold"><i class="fa-solid fa-sort-amount-down"></i> Nearest Reachable</span>
                        </div>`;
            
            let hasReachable = false;

            processedStationsList.forEach((st, index) => {
                if(st.reachable) hasReachable = true;

                const statusClass = st.reachable 
                    ? 'border-l-4 border-l-green-500 hover:bg-green-50' 
                    : 'disabled border-l-4 border-l-gray-300';
                
                let badgesHtml = '';
                if (st.reachable) {
                    if (index < 3) {
                        badgesHtml += `<span class="badge badge-green ml-2"><i class="fa-solid fa-thumbs-up"></i> Recommended</span>`;
                    } else if (st.rating >= 4.7) {
                        badgesHtml += `<span class="badge badge-gold ml-2"><i class="fa-solid fa-trophy"></i> Top Pick</span>`;
                    }
                }
                
                // --- FIX: Pass INDEX to selectStation instead of Object ---
                html += `
                    <div class="station-card ${statusClass}" onclick="selectStation(${index})">
                        <div class="flex justify-between items-start">
                            <div>
                                <div class="font-bold text-gray-800 flex items-center">
                                    ${st.name} ${badgesHtml}
                                </div>
                                <div class="text-xs text-gray-500 mb-1">${st.address.town || 'Unknown'}</div>
                                <div class="text-xs font-bold text-yellow-500">
                                    <i class="fa-solid fa-star"></i> ${st.rating} <span class="text-gray-400 font-normal">(${st.reviews})</span>
                                </div>
                            </div>
                            <div class="text-right">
                                <div class="font-black text-lg text-gray-700">${(st.distance * DIST_FACTOR).toFixed(1)} ${DIST_LABEL}</div>
                                ${st.reachable 
                                    ? `<span class="text-green-600 text-xs font-bold">REACHABLE</span>` 
                                    : `<span class="text-red-400 text-xs font-bold">TOO FAR</span>`}
                            </div>
                        </div>
                    </div>`;
                
                const marker = L.marker([st.location.latitude, st.location.longitude], {
                    icon: chargerIcon, 
                    opacity: st.reachable ? 1 : 0.4
                }).addTo(map);

                marker.on('click', () => {
                    selectStation(index);
                });
            });

            if(!hasReachable) {
                html = `<div class="text-center p-6 bg-red-50 rounded-xl border border-red-100">
                            <i class="fa-solid fa-battery-empty text-3xl text-red-500 mb-2"></i>
                            <h3 class="font-bold text-red-800">Critical Low Battery</h3>
                            <p class="text-sm text-red-600 mt-1">No stations within ${(safeRange * DIST_FACTOR).toFixed(1)} ${DIST_LABEL}.</p>
                        </div>` + html;
            }

            container.innerHTML = html;
        }

        async function selectStation(index) {
            const station = processedStationsList[index];
            
            // Allow viewing details but warn if too far
            if(!station.reachable) { 
                alert("⚠️ Warning: This station is beyond your estimated range.");
                // We let them proceed but with a warning, or return; to block
                // return; 
            }
            
            selectedStation = station;
            
            const container = document.getElementById('content-area');
            container.innerHTML = `
                <div class="flex flex-col h-full">
                    <div class="bg-blue-50 p-4 rounded-xl border border-blue-200 mb-6">
                        <div class="flex justify-between items-start">
                            <div>
                                <h2 class="text-xl font-black text-gray-900">${station.name}</h2>
                                <div class="text-sm text-yellow-600 font-bold mt-1"><i class="fa-solid fa-star"></i> ${station.rating} Recommended</div>
                            </div>
                            <div class="text-2xl font-black text-blue-600">${(station.distance * DIST_FACTOR).toFixed(1)} ${DIST_LABEL}</div>
                        </div>
                    </div>
                    
                    <button onclick="startRealNavigation()" class="w-full py-4 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold text-lg shadow-lg mb-auto flex items-center justify-center gap-2">
                        <i class="fa-solid fa-play"></i> Start Simulation
                    </button>
                    
                    <button onclick="renderStationList(cachedStations)" class="mt-4 text-sm text-gray-500 underline w-full text-center">Back to List</button>
                </div>`;
            
            if(routePolyline) map.removeLayer(routePolyline);
            const coords = [[userLat, userLng], [station.location.latitude, station.location.longitude]];
            routePolyline = L.polyline(coords, {color: '#3b82f6', weight: 6}).addTo(map);
            map.fitBounds(routePolyline.getBounds(), { padding: [50, 50] });
        }

        function startRealNavigation() {
            if(!selectedStation) return;
            document.getElementById('content-area').innerHTML = `
                <div class="flex flex-col h-full justify-center items-center">
                    <h2 class="text-2xl font-black text-gray-800 mb-2">Simulating Drive...</h2>
                    <p class="text-gray-500 mb-6">Driving to ${selectedStation.name}</p>
                    <button onclick="arriveAtStation()" class="px-8 py-3 bg-green-600 hover:bg-green-700 text-white rounded-full font-bold shadow-lg transition">Arrive Instantly</button>
                </div>`;
            document.getElementById('nav-status').style.display = 'block';
            
            if(carMarker) map.removeLayer(carMarker);
            carMarker = L.marker([userLat, userLng], {icon: carIcon}).addTo(map);
            let steps = 500; let step = 0;
            const dLat = (selectedStation.location.latitude - userLat) / steps;
            const dLng = (selectedStation.location.longitude - userLng) / steps;
            
            function move() {
                if(step >= steps) { arriveAtStation(); return; }
                const lat = userLat + (dLat * step);
                const lng = userLng + (dLng * step);
                carMarker.setLatLng([lat, lng]);
                map.panTo([lat, lng]);
                step++;
                animationFrameId = requestAnimationFrame(move);
            }
            move();
        }

        function arriveAtStation() {
            cancelAnimationFrame(animationFrameId);
            
            if (selectedStation && carMarker) {
                const destLat = selectedStation.location.latitude;
                const destLng = selectedStation.location.longitude;
                carMarker.setLatLng([destLat, destLng]);
                map.panTo([destLat, destLng]);
            }

            // Save the emergency trip to history
            saveEmergencyTrip();

            document.getElementById('nav-status').style.display = 'none';
            document.getElementById('content-area').innerHTML = `
                <div class="flex flex-col h-full">
                    <h1 class="text-2xl font-black text-gray-800 mb-1">Charging Station</h1>
                    <p class="text-gray-500 mb-6 text-sm">Input your new battery level.</p>
                    <div class="flex-1 flex flex-col justify-center items-center bg-gray-50 rounded-2xl border-2 border-dashed border-gray-200 mb-6">
                        <i class="fa-solid fa-bolt text-yellow-400 text-6xl mb-4"></i>
                        <div class="flex items-baseline">
                            <input type="number" id="new-batt-input" oninput="if(this.value>100)this.value=100; if(this.value<0)this.value=0;" class="text-6xl font-black text-center w-32 bg-transparent focus:outline-none" placeholder="0" min="0" max="100">
                            <span class="text-3xl text-gray-400 font-bold">%</span>
                        </div>
                    </div>
                    <div id="error-msg" class="text-center text-sm font-bold text-red-500 mb-4 hidden">Charge to at least 70%.</div>
                    <button onclick="finishCharging()" class="w-full bg-gray-900 text-white py-4 rounded-xl font-bold text-xl hover:bg-gray-800 transition">Finish Charging</button>
                </div>`;
        }

        async function saveEmergencyTrip() {
            if (!selectedStation) return;
            const userId = localStorage.getItem("user_id");
            if (!userId) return;

            const dist = selectedStation.distance;
            // Calculate estimated drained % based on car specs
            const efficiency = CAR_SPECS.efficiency || 160; // Wh/km
            const capacity = CAR_SPECS.capacity || 60; // kWh
            const drainedKwh = dist * (efficiency / 1000);
            const drainedPct = (drainedKwh / capacity) * 100;

            try {
                await fetch('http://localhost/WEBPROG_PROJ/BACKEND/API/BATTERY/logs.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: userId,
                        distance_km: dist.toFixed(2),
                        battery_drained: drainedPct.toFixed(1),
                        origin: "Emergency Location",
                        destination: selectedStation.name
                    })
                });
            } catch (e) { console.error("Error saving emergency log", e); }
        }

        function finishCharging() {
            const val = parseInt(document.getElementById('new-batt-input').value);
            const err = document.getElementById('error-msg');
            if (!val || val < 70 || val > 100) { err.innerText = "Please charge to at least 70%."; err.classList.remove('hidden'); return; }
            
            // Save new battery level for Dashboard/Trip Planner
            localStorage.setItem('user_battery_level', val);

            document.getElementById('modal-final-batt').innerText = val + "%";
            document.getElementById('finish-modal').classList.add('active');
            localStorage.setItem("forceCharging", "0");
            localStorage.setItem("ev_lock_status", "unlocked");
            localStorage.removeItem("ev_target_charger");
        }

        function switchToHomeCharging() {
            document.getElementById('content-area').innerHTML = `
                <div class="flex flex-col h-full">
                    <h1 class="text-2xl font-black text-gray-800 mb-1">Home Charging</h1>
                    <p class="text-gray-500 mb-6 text-sm">Connect to your home charger.</p>
                    <div class="flex-1 flex flex-col justify-center items-center bg-gray-50 rounded-2xl border-2 border-dashed border-gray-200 mb-6">
                        <i class="fa-solid fa-plug text-green-500 text-6xl mb-4 animate-bounce"></i>
                        <div class="flex items-baseline">
                            <input type="number" id="new-batt-input" oninput="if(this.value>100)this.value=100; if(this.value<0)this.value=0;" class="text-6xl font-black text-center w-32 bg-transparent focus:outline-none" placeholder="0" min="0" max="100">
                            <span class="text-3xl text-gray-400 font-bold">%</span>
                        </div>
                    </div>
                    <div id="error-msg" class="text-center text-sm font-bold text-red-500 mb-4 hidden">Charge to at least 70%.</div>
                    <button onclick="finishCharging()" class="w-full bg-gray-900 text-white py-4 rounded-xl font-bold text-xl hover:bg-gray-800 transition">Finish Charging</button>
                    <button onclick="location.reload()" class="mt-3 text-sm text-gray-400 font-bold hover:text-gray-600 w-full">Cancel</button>
                </div>`;
        }

        function exitToPlanner() { window.location.href = "trip_planner.html"; }
        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; 
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }
    </script>
</body>
</html>
